name: Seelenreise Auto-Post
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  push:
    paths: ["trigger.txt"]
  workflow_dispatch:
    inputs:
      count:
        description: "Videos pro Plattform jetzt veroeffentlichen"
        default: "1"
      platforms:
        description: "fb,ig"
        default: "fb,ig"
permissions:
  contents: write
concurrency: autopost
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veroeffentlichen
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          PLATFORMS: ${{ github.event.inputs.platforms || (github.event_name == 'push' && 'fb' || 'fb,ig') }}
        run: python3 publish.py
      - name: Status speichern
        if: always()
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Status" && git pull --rebase -q && git push)
